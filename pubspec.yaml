name: gastuber
description: "Aplicación móvil de transporte para Trabajo Práctico"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Mapas y Ubicación
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1

  # Gestión de Estado
  provider: ^6.1.2

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1

  # UI / Iconos
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
